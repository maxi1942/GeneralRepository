# Copenhagen housing market monitor — configuration
#
# Everything the pipeline needs is here so you can adjust scope WITHOUT touching code.

scope:
  name: "Copenhagen + Frederiksberg"
  zipcode_from: 1000
  zipcode_to: 2500

# Raw query parameters sent to Boliga's FOR-SALE endpoint.
# If a run returns 0 listings, these param names have most likely drifted — the run
# log prints the request URL + count. Known-working alternatives:
#   zipcodeFrom / zipcodeTo  (range, default) · zipCodes: "1000-2500" · zipCodes: "1050,1051,..."
query_params:
  zipcodeFrom: 1000
  zipcodeTo: 2500

# Raw query parameters sent to Boliga's SOLD endpoint (realised sale prices, from the
# land registry — lags ~1-3 months). salesDateMin/Max are filled in automatically from
# `sold.lookback_days`; anything set here is passed through as-is.
sold_query_params:
  zipcodeFrom: 1000
  zipcodeTo: 2500

# District definitions — postcode ranges (approximate; postcode != neighbourhood
# exactly, but close). Listings are tagged by the first district whose range contains
# their postcode. Order matters only for display.
districts:
  koebenhavn_k:    { label: "København K",     ranges: [[1050, 1499]] }
  vesterbro:       { label: "Vesterbro",       ranges: [[1500, 1799]] }
  frederiksberg_c: { label: "Frederiksberg C", ranges: [[1800, 1999]] }
  frederiksberg:   { label: "Frederiksberg",   ranges: [[2000, 2000]] }
  oesterbro:       { label: "Østerbro",        ranges: [[2100, 2100]] }
  nordhavn:        { label: "Nordhavn",        ranges: [[2150, 2150]] }
  noerrebro:       { label: "Nørrebro",        ranges: [[2200, 2200]] }
  amager:          { label: "Amager (S)",      ranges: [[2300, 2300]] }
  nordvest:        { label: "Nordvest",        ranges: [[2400, 2400]] }
  sydhavn:         { label: "Sydhavn (SV)",    ranges: [[2450, 2450]] }
  valby:           { label: "Valby",           ranges: [[2500, 2500]] }

# Which districts get their own line on the by-district TREND charts (kept small so the
# charts stay readable). The full set above still tags every listing and fills the
# going-rates table + Explore filter.
chart_districts: [koebenhavn_k, vesterbro, frederiksberg_c, oesterbro, noerrebro]

# Property-type segmentation. Codes verified against a live 2026-09-14 snapshot:
#   3 = ejerlejlighed (apartment) · 1 = villa · 2 = rækkehus (townhouse)
#   9/4/5/6/11 = co-op-like / holiday / land / andel -> "other"
property_type_buckets:
  apartment: [3]
  house: [1, 2]

scraper:
  base_url: "https://api.boliga.dk/api/v2/search/results"
  page_size: 100
  max_pages: 200
  request_timeout_sec: 30
  sleep_between_requests_sec: 0.7
  max_retries: 4

sold:
  base_url: "https://api.boliga.dk/api/v2/sold/search/results"
  lookback_days: 180         # how far back to fetch sold records (for price trend + comps)
  page_size: 100
  max_pages: 300
  enabled: true              # set false to skip the sold fetch entirely
  # Months-of-supply is biased HIGH if it counts recent sales, because the land
  # registry lags: the last few weeks of sales aren't registered yet, so a
  # trailing-to-today window undercounts sales and overstates supply. So the sales
  # RATE is measured over a window that ends `rate_lag_days` ago (fully registered)
  # and spans `rate_window_days`.
  rate_lag_days: 42          # skip the most recent ~6 weeks (incomplete registration)
  rate_window_days: 90       # measure the sales rate over this fully-registered span
  # Sold is best-effort (secondary to the live feed): short timeout, few retries, and a
  # hard time budget so a throttled Boliga can't drag the run. Partial data is fine.
  request_timeout_sec: 15
  max_retries: 2
  time_budget_sec: 120

# Valuation model (#2): estimate each active listing's expected SALE value from
# comparable *sold* records, then compare to its asking price. Comps are found by
# relaxing filters until at least `min_comps` are found.
valuation:
  min_comps: 8
  size_tolerance: 0.25       # ±25% living area counts as comparable
  # Guardrails so the "best value" ranking isn't dominated by data artefacts:
  # andelsbolig (co-op) listings and errors show nonsense price/m². We only trust a
  # listing's gap when its price/m² is in a plausible freehold band AND its own
  # price ÷ size roughly matches the reported price/m². Foreclosures and non-
  # apartment/house types are excluded from valuation entirely.
  sane_sqm_min: 18000        # DKK/m² floor (co-op andel prices fall below this)
  sane_sqm_max: 200000       # DKK/m² ceiling (above = data error / ultra-prime outlier)
  consistency_tol: 0.20      # reported price/m² must be within ±20% of price ÷ size

# Per-listing detail enrichment (for the undervalued finder). Each listing is fetched
# at most once, ever (cached), capped per run, undervalued candidates first.
detail:
  enabled: true
  # Undocumented endpoint — candidates tried in order. The first run logs the real
  # response shape (search the run log for "DETAIL SAMPLE"); adjust if all fail.
  endpoints:
    - "https://api.boliga.dk/api/v2/estate/{id}"
    - "https://api.boliga.dk/api/v2/property/{id}"
    - "https://api.boliga.dk/api/v2/estates/{id}"
    - "https://api.boliga.dk/api/v1/estate/{id}"
  max_per_run: 150           # endpoint confirmed (api/v2/estate/{id}); candidates first
  sleep_between_requests_sec: 0.8
  request_timeout_sec: 12    # detail is best-effort — short timeout, few retries
  max_retries: 1
  time_budget_sec: 180       # hard cap on total detail-fetch time per run
  abort_after_consecutive_failures: 12   # bail if rate-limited; resume next run
  cache: "data/details.csv.gz"

paths:
  raw_dir: "data/raw"
  sold_raw_dir: "data/sold_raw"
  metrics_csv: "data/metrics_weekly.csv"
  dashboard_html: "dashboard.html"
