# Copenhagen housing market monitor — configuration
#
# Everything the pipeline needs is here so you can adjust scope WITHOUT touching code.

scope:
  name: "Copenhagen + Frederiksberg"
  zipcode_from: 1000
  zipcode_to: 2500

# Raw query parameters sent to Boliga's FOR-SALE endpoint.
# If a run returns 0 listings, these param names have most likely drifted — the run
# log prints the request URL + count. Known-working alternatives:
#   zipcodeFrom / zipcodeTo  (range, default) · zipCodes: "1000-2500" · zipCodes: "1050,1051,..."
query_params:
  zipcodeFrom: 1000
  zipcodeTo: 2500

# Raw query parameters sent to Boliga's SOLD endpoint (realised sale prices, from the
# land registry — lags ~1-3 months). salesDateMin/Max are filled in automatically from
# `sold.lookback_days`; anything set here is passed through as-is.
sold_query_params:
  zipcodeFrom: 1000
  zipcodeTo: 2500

# District definitions — postcode ranges (approximate; postcode != neighbourhood
# exactly, but close). Listings are tagged by the first district whose range contains
# their postcode. Order matters only for display.
districts:
  koebenhavn_k:    { label: "København K",     ranges: [[1050, 1473]] }
  vesterbro:       { label: "Vesterbro",       ranges: [[1500, 1799]] }
  frederiksberg_c: { label: "Frederiksberg C", ranges: [[1800, 1999]] }
  oesterbro:       { label: "Østerbro",        ranges: [[2100, 2100]] }
  noerrebro:       { label: "Nørrebro",        ranges: [[2200, 2200]] }

# Property-type segmentation. Codes verified against a live 2026-09-14 snapshot:
#   3 = ejerlejlighed (apartment) · 1 = villa · 2 = rækkehus (townhouse)
#   9/4/5/6/11 = co-op-like / holiday / land / andel -> "other"
property_type_buckets:
  apartment: [3]
  house: [1, 2]

scraper:
  base_url: "https://api.boliga.dk/api/v2/search/results"
  page_size: 100
  max_pages: 200
  request_timeout_sec: 30
  sleep_between_requests_sec: 0.7
  max_retries: 4

sold:
  base_url: "https://api.boliga.dk/api/v2/sold/search/results"
  lookback_days: 180         # how far back to fetch sold records (for price trend + comps)
  page_size: 100
  max_pages: 300
  enabled: true              # set false to skip the sold fetch entirely
  # Months-of-supply is biased HIGH if it counts recent sales, because the land
  # registry lags: the last few weeks of sales aren't registered yet, so a
  # trailing-to-today window undercounts sales and overstates supply. So the sales
  # RATE is measured over a window that ends `rate_lag_days` ago (fully registered)
  # and spans `rate_window_days`.
  rate_lag_days: 42          # skip the most recent ~6 weeks (incomplete registration)
  rate_window_days: 90       # measure the sales rate over this fully-registered span

# Valuation model (#2): estimate each active listing's expected SALE value from
# comparable *sold* records, then compare to its asking price. Comps are found by
# relaxing filters until at least `min_comps` are found.
valuation:
  min_comps: 8
  size_tolerance: 0.25       # ±25% living area counts as comparable

paths:
  raw_dir: "data/raw"
  sold_raw_dir: "data/sold_raw"
  metrics_csv: "data/metrics_weekly.csv"
  dashboard_html: "dashboard.html"
